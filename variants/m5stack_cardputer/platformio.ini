; Cardputer SX1262 LoRa Cap hardware port from working v0.4.4 build.
; Latest DX aquarium and community PRs remain in ui-new.
[cardputer_loragotchi_base]
extends = esp32_base
board = m5stack_cardputer
board_build.partitions = default_8MB.csv
build_flags = ${esp32_base.build_flags}
  -I variants/m5stack_cardputer
  -D M5STACK_CARDPUTER
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D BOARD_HAS_PSRAM=1
  -D PIN_USER_BTN=0
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D USE_SX1262
  -D P_LORA_NSS=5
  -D P_LORA_DIO_1=4
  -D P_LORA_RESET=3
  -D P_LORA_BUSY=6
  -D P_LORA_MOSI=14
  -D P_LORA_MISO=39
  -D P_LORA_SCLK=40
  -D PIN_BOARD_SDA=2
  -D PIN_BOARD_SCL=1
  -D PIN_VBAT_READ=10
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_CURRENT_LIMIT=240
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_DIO3_TCXO_VOLTAGE=3.3
  -D LORA_TX_POWER=22
  -D DISPLAY_CLASS=M5CardputerDisplay
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/m5stack_cardputer>
  -<../variants/m5stack_cardputer/test_main.cpp>
  +<helpers/ui/M5CardputerDisplay.cpp>
lib_deps = ${esp32_base.lib_deps}
  M5Cardputer=https://github.com/m5stack/M5Cardputer

[env:cardputer_loragotchi]
extends = cardputer_loragotchi_base
build_flags = ${cardputer_loragotchi_base.build_flags}
  -I examples/companion_radio/ui-new
  -D LORAFISH_UI=1
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D AUTO_OFF_MILLIS=30000
  -D LORAFISH_CARDPUTER_25D=1
build_src_filter = ${cardputer_loragotchi_base.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps = ${cardputer_loragotchi_base.lib_deps}
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0
